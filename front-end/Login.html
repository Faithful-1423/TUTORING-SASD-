<body>
  <div class="bg"></div>
  <div class="bg bg2"></div>
  <div class="bg bg3"></div>
  <nav>
    <ul>
      <header id="top">
        <li class="name">
          <div><i id="name">SASD TUTORING </i>
          </div>
        </li>
      </header>
      <li><a href="file:///c%3A/Users/29-HaqReh/Desktop/Web%20Apps/stuff/sasdTutor.html#offered">Offered Classes</a>
      </li>
      <li><a href="front-end/Login.html">Account Login</a></li>
      <li><a href="front-end/sasdTutor.html#about">About Us</a></li>

      <li><a href="front-end/sasdTutor.html#resources">Resources</a></li>
    </ul>
  </nav><br>
  <main><br>
    <section id="account">
      <div class="title">
        <h1 data-tooltip="LOG IN"></h1>
        <hr>
      </div>
      <div id="form"></div>
      <template id="login-options-template">
        <button type="button" id="user"><strong>Login</strong></button>
        <button type="button" id="signup"><strong>Sign Up</strong></button><br><br>
      </template>
      <template id="login-form-template">
        <search>
          <form action="stuff/Login.html" method="post">
            <label for="username">Email:</label>
            <input type="text" id="email" name="email" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <input type="submit" value="Login">
            <!-- Maybe add a section for forgot password-->
            <!--also add an option to login using just your google account-->
            <button type="button" id="back"><strong>Go Back?</strong></button>
          </form>
        </search>
      </template>
      <template id="signup-options-template">
        <form action="stuff/Login.html" method="post" if="loginForm">
          <label for="new-email">Email:</label>
          <input type="email" id="new-email" name="new-email" autocomplete="email" required><br><br>
          <label for="new-password">Password:</label>
          <!-- Maybe add a section for a code from Mrs.Dickerson, so unauthroized personel can't make an account-->
          <input type="password" id="new-password" name="new-password" autocomplete="new-password" required><br><br>
          <input type="submit" value="Sign Up">
          <button type="button" id="back"><strong>Go Back?</strong></button>
        </form>
      </template>
    </section>
  </main>
  <footer>
    <div id="bottom" style="margin: 229px 0 0; ">
      <h3>Resources</h3>
      <ul>
        <li><a href="https://www.soudertonsd.org/" target="_blank">Souderton School District Website</a></li>
        <li><a href="https://github.com/vardra77/TutoringWebsiteSkibidi" target="_blank">Website's Github</a></li>
      </ul>
    </div>
  </footer>
</body>

</html>
